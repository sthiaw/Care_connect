name: CareConnect checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  live-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verify production website
        run: curl --fail --silent --show-error --retry 3 https://careconnect-homecare.vercel.app/ > /dev/null
      - name: Verify CareConnect authentication service
        run: |
          status=$(curl --silent --show-error --retry 3 --output /dev/null --write-out "%{http_code}" https://hrbnpsjwmejpkqgxnwzh.supabase.co/auth/v1/health)
          test "$status" = "200" || test "$status" = "401"
